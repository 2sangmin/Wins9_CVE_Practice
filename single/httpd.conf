# =============================================================================
# CVE-2026-21962 CTF — 단일 컨테이너용 httpd.conf
# 2-컨테이너판과 유일한 차이: WebLogicHost backend → 127.0.0.1
# (백엔드가 같은 컨테이너의 localhost:7101 에서 돌기 때문)
# =============================================================================
ServerRoot "/u01/oracle/ohs/ohs"
Listen 7777
ServerName localhost:7777
PidFile "/tmp/ohs_httpd.pid"

User oracle
Group oinstall

# ---- 필수 모듈 (실제 설치된 .so 이름 그대로) ----
LoadModule mpm_worker_module    modules/mod_mpm_worker.so
LoadModule unixd_module         modules/mod_unixd.so
LoadModule authz_core_module    modules/mod_authz_core.so
LoadModule authz_host_module    modules/mod_authz_host.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule log_config_module    modules/mod_log_config.so
LoadModule dir_module           modules/mod_dir.so
LoadModule alias_module         modules/mod_alias.so
LoadModule env_module           modules/mod_env.so
LoadModule setenvif_module      modules/mod_setenvif.so
LoadModule headers_module       modules/mod_headers.so
# ---- WebLogic 프록시 플러그인 (취약점의 핵심) ----
LoadModule weblogic_module      modules/mod_wl_ohs.so

# ---- 로그: 컨테이너 stdout/stderr 로 ----
ErrorLog "/dev/stderr"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "/dev/stdout" common

# ---- 기본 보안: 파일시스템 루트 차단 ----
<Directory />
    AllowOverride none
    Require all denied
</Directory>

# ---- 랜딩 페이지 (healthcheck + 솔버 안내) ----
DocumentRoot "/u01/oracle/htdocs"
<Directory "/u01/oracle/htdocs">
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
DirectoryIndex index.html

# =============================================================================
# CVE-2026-21962 트리거 구성
# =============================================================================
# /foo → 백엔드(WebLogic 역할)로 프록시.  단일 컨테이너라 같은 호스트(127.0.0.1).
<Location /foo>
    WLSRequest ON
    WebLogicHost 127.0.0.1
    WebLogicPort 7101
</Location>

# /internal-admin → 프론트(OHS)에서 차단. 정상 접근은 404.
# ..; 우회 성공 시 프론트는 /foo 로 인식해 통과 → 백엔드가 보호 리소스를 내줌.
<Location /internal-admin>
    ErrorDocument 404 'OHS: Disallowed location'
    Redirect 404 /
</Location>
