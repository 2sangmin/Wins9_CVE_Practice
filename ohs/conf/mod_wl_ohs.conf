# =============================================================================
# mod_wl_ohs 프록시 설정 — CVE-2026-21962 트리거 구성
# (저번 프로젝트 README 의 "minimal trigger" 구성 그대로)
# =============================================================================
# 이 파일을 OHS 인스턴스의 moduleconf 디렉터리에 넣어 로드시킵니다.
#   보통 위치: $DOMAIN_HOME/config/fmwconfig/components/OHS/<인스턴스명>/moduleconf/

# 프록시 플러그인 모듈 로드 (경로는 설치본에 맞게 확인)
LoadModule weblogic_module "${ORACLE_HOME}/ohs/modules/mod_wl_ohs.so"

# /foo 로 들어온 요청 → 백엔드(WebLogic 역할)로 프록시
<Location /foo>
  WLSRequest ON
  WebLogicHost backend
  WebLogicPort 7101
</Location>

# /internal-admin 은 프론트(OHS)에서 차단 → 정상 접근은 404.
# 우회(..;)에 성공하면 프론트는 /foo 로 인식해 통과시키고, 백엔드가 보호 리소스를 내줌.
<Location /internal-admin>
  ErrorDocument 404 'OHS: Disallowed location'
  Redirect 404 /
</Location>
